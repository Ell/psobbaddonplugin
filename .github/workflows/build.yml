name: Windows build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build release DLL
        run: msbuild bbmod.sln /m /p:Configuration=Release /p:Platform=x86
      - name: Build and run native recovery tests
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          call tests\run.cmd
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item Release/dinput8.dll, Release/dinput8.pdb, README.md, CHANGELOG.md dist
          Copy-Item addons dist/addons -Recurse
          Copy-Item tests/recovery-tests.exe dist
      - uses: actions/upload-artifact@v4
        with:
          name: bbmod-native-autoreload
          path: dist/
