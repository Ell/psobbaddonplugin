name: Windows build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build release DLL
        run: msbuild bbmod.sln /m /p:Configuration=Release /p:Platform=x86
      - name: Build and run native recovery tests
        timeout-minutes: 2
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          call tests\run.cmd
      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics
          Copy-Item Release/dinput8.*, tests/recovery-tests.* diagnostics -ErrorAction SilentlyContinue
          Copy-Item "$env:TEMP/bbmod-recovery-*" diagnostics -Recurse -ErrorAction SilentlyContinue
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: diagnostics/
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item Release/dinput8.dll, Release/dinput8.pdb, README.md, CHANGELOG.md dist
          Copy-Item addons dist/addons -Recurse
          Copy-Item tests/recovery-tests.exe dist
      - uses: actions/upload-artifact@v4
        with:
          name: bbmod-native-autoreload
          path: dist/
